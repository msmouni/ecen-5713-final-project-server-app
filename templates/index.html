<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Sensor Dashboard</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Google Charts -->
    <script
      type="text/javascript"
      src="https://www.gstatic.com/charts/loader.js"
    ></script>

    <style>
      body {
        background-color: #e1f8ff;
        padding-top: 20px;
      }

      .chart-container {
        margin-bottom: 40px;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h1 class="mb-4 text-center">🌡️ Sensor Dashboard</h1>

      <div class="chart-container">
        <h4>Temperature</h4>
        <div id="temp_chart" style="width: 100%; height: 400px"></div>
      </div>

      <div class="chart-container">
        <h4>Pressure</h4>
        <div id="pressure_chart" style="width: 100%; height: 400px"></div>
      </div>

      <div class="chart-container">
        <h4>Humidity</h4>
        <div id="humidity_chart" style="width: 100%; height: 400px"></div>
      </div>
    </div>
  </body>
</html>
